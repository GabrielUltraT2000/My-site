<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="images/IconBogas.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Sinister Site</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}

@keyframes redWhiteFlicker{
0%{color:white;}
50%{color:red;}
100%{color:white;}
}

.side-title{animation:redWhiteFlicker .5s infinite;}

body{
color:white;
background:#111;
min-height:100vh;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background-image:url('images/Background/background.png');
background-position:center;
background-size:cover;
background-repeat:no-repeat;
opacity:.25;
z-index:-1;
}

header{
text-align:center;
padding:30px 10px;
background:rgba(0,0,0,.6);
}

section{
padding:40px 10%;
background:rgba(0,0,0,.6);
margin:20px auto;
border-radius:10px;
max-width:1000px;
}

h2{text-align:center;margin-bottom:15px;}

.side-links{
position:fixed;
top:50%;
transform:translateY(-50%);
display:flex;
flex-direction:column;
gap:15px;
z-index:5;
}

.side-links.left{left:50px;}
.side-links.right{right:50px;}

.side-links img{
width:150px;
height:150px;
object-fit:cover;
border-radius:10px;
transition:.2s;
}

.side-links img:hover{transform:scale(1.1);}

.mural-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
margin-top:20px;
}

.mural-item{
background:rgba(255,255,255,.08);
padding:10px;
border-radius:10px;
text-align:center;
transition:.2s;
}

.mural-item:hover{
transform:scale(1.05);
background:rgba(255,255,255,.15);
}

.mural-item img{
width:100%;
height:150px;
object-fit:cover;
border-radius:8px;
}

.slider{overflow:hidden;border-radius:10px;}
.slides{display:flex;transition:transform .5s ease-in-out;}

.friend{
min-width:100%;
text-align:center;
}

.friend img{
width:100%;
max-width:500px;
max-height:500px;
object-fit:cover;
border-radius:50%;
margin-bottom:10px;
}

.friend-name{
display:inline-block;
background:#d3d3d3;
color:black;
padding:6px 14px;
border-radius:8px;
font-weight:bold;
}

.slider-buttons{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

button{
padding:8px 15px;
border:none;
border-radius:5px;
cursor:pointer;
background:#444;
color:white;
}

.music iframe,
.map iframe{
width:100%;
border:none;
border-radius:10px;
}

.map iframe{height:350px;}

footer{
text-align:center;
padding:20px;
background:rgba(0,0,0,.6);
margin-top:20px;
}

#birthdayNotif{
position:fixed;
bottom:20px;
right:20px;
background:#ff4081;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
z-index:20;
font-weight:bold;
}

.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
justify-content:center;
align-items:center;
z-index:30;
}

.popup-content{
background:#222;
padding:20px;
border-radius:10px;
text-align:center;
}

.popup-content img{
width:400px;
max-width:90%;
height:auto;
margin:10px 0;
}

#confetti{
position:fixed;
inset:0;
pointer-events:none;
}
</style>
</head>

<body>

<header>
<h1>Welcome to Sinister Site!</h1>
<p>About me, my friends, and things I like</p>
</header>

<!-- ===== Birthday popup ===== -->
<div id="birthdayNotif">🌮 ME CLICA!!</div>

<div id="birthdayPopup" class="popup">
<canvas id="confetti"></canvas>

<div class="popup-content">
<h2>FELIZ ANIVERSÁRIO GLEISU!!!</h2>
<img src="music/glesor.png">
<br>
<button onclick="closePopup()">Close</button>
</div>
</div>

<audio id="birthdayMusic" src="music/Raining Tacos - Parry Gripp & BooneBum.mp3"></audio>

<footer>
<p>lel</p>
</footer>

<script>
const notif=document.getElementById("birthdayNotif");
const popup=document.getElementById("birthdayPopup");
const music=document.getElementById("birthdayMusic");

notif.onclick=()=>{
popup.style.display="flex";
music.currentTime=0;
music.play();
startConfetti();
};

function closePopup(){
popup.style.display="none";
music.pause();
}

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

const tacoImg=new Image();
tacoImg.src="music/taco.png";

function resizeCanvas(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

let confettiPieces=[];

function startConfetti(){
confettiPieces=[];
for(let i=0;i<100;i++){
confettiPieces.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height-canvas.height,
size:Math.random()*30+20,
speed:Math.random()*3+2,
angle:Math.random()*Math.PI
});
}
animateConfetti();
}

function animateConfetti(){
ctx.clearRect(0,0,canvas.width,canvas.height);

confettiPieces.forEach(p=>{
p.y+=p.speed;
p.x+=Math.sin(p.angle);

ctx.drawImage(tacoImg,p.x,p.y,p.size,p.size);

if(p.y>canvas.height)p.y=-10;
});

if(popup.style.display==="flex"){
requestAnimationFrame(animateConfetti);
}
}
</script>

</body>
</html>
